name: Weekly Kanopy Data Sync

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Data Pipeline
        run: |
          python generate_data.py

      - name: Commit and Push
        run: |
          git config --global user.name "BibVid"
          git config --global user.email "bib4@gmail.com"
          git add kanopy_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Weekly Auto-Update: $(date +'%Y-%m-%d')" && git push)
